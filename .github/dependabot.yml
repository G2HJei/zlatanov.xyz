version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*', 'prettier-plugin-tailwindcss']
      testing:
        patterns: ['vitest', '@playwright/*']
      tooling:
        patterns: ['oxlint', 'prettier', 'prettier-plugin-astro', '@types/*', 'yaml']
    ignore:
      # @astrojs/check supports TypeScript ^5 || ^6 only.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
