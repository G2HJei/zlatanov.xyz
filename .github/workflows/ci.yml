name: CI

on:
  push:
    branches: [master]

# Runs queue instead of cancelling each other, so a deploy is never cut off half-way.
concurrency:
  group: ci-master
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Docker Hub repository (under DOCKER_USERNAME) and container name on the VPS.
  # Docker Hub allows only [a-z0-9_-] in repository names, hence the hyphen.
  IMAGE_NAME: zlatanov-xyz
  BUILD_NUMBER: ${{ github.run_number }}
  # Loopback port the container is published on; the VPS nginx proxies to it.
  HOST_PORT: 8080

jobs:
  verify:
    name: Lint, check, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run check

      - run: npm test

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  image:
    name: Docker image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: DockerHub > login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: DockerHub > push (${{ env.BUILD_NUMBER }})
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.BUILD_NUMBER }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pull first so a failed pull leaves the old container running. Prune last so the
      # image just started stays and the previous builds go.
      - name: Deploy ${{ env.IMAGE_NAME }}:${{ env.BUILD_NUMBER }}
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.BUILD_NUMBER }}
          VPS_IP: ${{ secrets.VPS_IP }}
          SSHPASS: ${{ secrets.VPS_PASS }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS_IP" "
            set -e
            docker pull $IMAGE
            docker stop $IMAGE_NAME || true
            docker rm $IMAGE_NAME || true
            docker run -d --name $IMAGE_NAME --restart unless-stopped -p 127.0.0.1:$HOST_PORT:8080 $IMAGE
            docker image prune -a -f
            docker ps --filter name=$IMAGE_NAME
          "
