# Server block for the site container. The base image's nginx.conf includes
# this file inside its http {} block. TLS, HSTS and CSP live on the reverse
# proxy in front of this container.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  # Directory redirects (/blog/x -> /blog/x/) must not leak the container port.
  absolute_redirect off;
  port_in_redirect off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/xml
             application/rss+xml image/svg+xml text/plain text/xml;

  error_page 404 /404.html;
  location = /404.html {
    internal;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  # Hashed build assets: safe to cache forever.
  location /_astro/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Everything else: revalidate on each request. Directory URLs map to index.html.
  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri $uri/ =404;
  }
}
